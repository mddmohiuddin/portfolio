# Auto-syncs the Photo Gallery from the shared Google Photos album.
# Runs every 6 hours and on manual "Run workflow". Writes gallery.json,
# which the website loads — so album changes appear without editing the site.
#
# One-time setup: Repo -> Settings -> Actions -> General -> Workflow permissions
# -> select "Read and write permissions" -> Save.

name: Sync Photo Gallery

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours (UTC)
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read Google Photos album
        run: node scripts/sync-gallery.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gallery.json
          if git diff --staged --quiet; then
            echo "No photo changes — nothing to commit."
          else
            git commit -m "chore: sync photo gallery from Google Photos"
            git push
          fi
